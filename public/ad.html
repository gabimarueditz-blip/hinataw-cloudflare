<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sponsored — Hinataw.exe</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0c16; color: #e8e8f2; }
    body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #11121f;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.2px; }
    .brand span:first-child { color: #fff; }
    .brand span:last-child { color: #ff6ea8; }
    .tag { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #0b0c16; background: #ffbade; padding: 5px 10px; border-radius: 999px; }
    main { max-width: 560px; margin: 0 auto; padding: 34px 20px 56px; text-align: center; }
    h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -0.3px; }
    .note { color: #a9a9bd; font-size: 13.5px; margin: 0 0 22px; }
    /* The tag injects its own creative here when the zone serves one. The box is
       kept so an in-page creative has a stable slot instead of stacking over the
       call to action. */
    #ad-slot {
      min-height: 250px; display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(255,255,255,0.12); border-radius: 14px; padding: 12px;
      background: rgba(255,255,255,0.02); overflow: hidden; margin-bottom: 22px;
    }
    #ad-slot iframe, #ad-slot img, #ad-slot video { max-width: 100%; }
    #continue {
      position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 30px; border: 0; border-radius: 999px; cursor: pointer;
      font: 800 16px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ff6ea8; color: #0b0c16; box-shadow: 0 10px 26px rgba(255,110,168,0.28);
      transition: transform .12s ease, background .12s ease;
    }
    #continue:hover { background: #ffbade; transform: translateY(-1px); }
    #continue:disabled { background: #3a3b52; color: #8d8ea6; box-shadow: none; cursor: progress; transform: none; }
    .fine { color: #6f7086; font-size: 12px; margin-top: 16px; }
    .skip { color: #a9a9bd; font-size: 13px; margin-top: 14px; }
    .skip a { color: #ffbade; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand"><span>Hinataw</span><span>.exe</span></div>
    <div class="tag">Sponsored</div>
  </div>

  <main>
    <h1>Your episode is ready</h1>
    <p class="note">
      It is playing in the tab you came from — this tab only shows the sponsor that
      keeps Hinataw.exe free. Nothing here can pause or reload your episode.
    </p>
    <div id="ad-slot"></div>
    <button id="continue" type="button" disabled>Continue in <span id="secs">3</span>…</button>
    <p class="skip"><a id="skip" href="/">Back to the episode</a></p>
    <p class="fine">One sponsor page per episode. You can close this tab at any time.</p>
  </main>

  <script>
    // This tab was opened by the player: sever the opener link immediately so no
    // ad code can navigate, reload or replace the page the viewer is watching.
    try { window.opener = null; } catch (e) {}
  </script>
  <!-- Owner tag (zone 12065764). The zone is an Onclick format: the network
       shows the advertiser on the first real click inside the page, so it has to
       live in a top-level tab and the viewer has to click there. The parked copy
       in the site itself stays inert. -->
  <script>
    (function (s) {
      s.dataset.zone = '12065764';
      s.src = 'https://al5sm.com/tag.min.js';
    })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));

    (function () {
      var btn = document.getElementById('continue');
      var secs = document.getElementById('secs');
      var skip = document.getElementById('skip');
      var params = new URLSearchParams(location.search);
      var key = params.get('k') || '';

      // The episode is only marked as sponsored here, and only once the viewer
      // has actually clicked: a tab that is opened and closed, or a same-tab
      // visit that is abandoned, leaves that episode's ad able to fire again.
      function remember() {
        if (!key) return;
        try {
          var store = 'hinataw_owner_ad_keys_v2';
          var ttl = 30 * 24 * 60 * 60 * 1000;
          var now = Date.now();
          var rows = JSON.parse(localStorage.getItem(store) || '[]');
          var map = new Map((Array.isArray(rows) ? rows : []).filter(
            function (r) { return Array.isArray(r) && r[0] && now - (Number(r[1]) || 0) < ttl; }
          ));
          map.set(key, now);
          localStorage.setItem(store, JSON.stringify(Array.from(map).slice(-300)));
        } catch (e) {}
      }
      // The tag is fetched asynchronously: a short countdown means it has
      // finished attaching its click handler before the button is usable, so
      // the click is not swallowed by a page that is not ready yet.
      var left = 3;
      var timer = setInterval(function () {
        left -= 1;
        if (left > 0) { secs.textContent = String(left); return; }
        clearInterval(timer);
        btn.disabled = false;
        btn.innerHTML = 'Continue \u25B6';
      }, 800);

      // The network answers the first click in this tab by loading the sponsor.
      // If it does not (tag blocked, no creative for this visitor), the click
      // must never strand the viewer on a dead page: hand them back to the page
      // they came from. That page is the player, and its return marker reopens
      // the episode — so Back, not Home, is always the destination. There is no
      // separate return page: the browser's own history does the job.
      function goBack() {
        // Close first: if this really is a separate sponsored tab, closing it
        // reveals the episode still sitting open in the tab behind.
        try { window.close(); } catch (e) {}
        setTimeout(function () {
          try {
            if (history.length > 1) { history.back(); return; }
          } catch (e) {}
          // Only a page opened with no history at all (a bookmark, a pasted
          // link) has nowhere to go back to.
          location.replace('/');
        }, 400);
      }
      // "Back to the episode" and Continue both take the browser's own history
      // route. The link keeps href="/" only as a no-JS fallback.
      if (skip) {
        skip.addEventListener('click', function (ev) {
          ev.preventDefault();
          goBack();
        });
      }
      // The viewer pressed Back from the advertiser and landed here again.
      // Bounce one more step straight to the episode instead of asking them to
      // press Back twice.
      window.addEventListener('pageshow', function (ev) {
        if (!ev.persisted) return;
        try { history.back(); } catch (e) {}
      });
      btn.addEventListener('click', function () {
        remember();
        // Long enough for a slow creative to start loading (a navigation kills
        // this timer); short enough that a capped visitor is not stranded.
        setTimeout(goBack, 2500);
      });
      // Any click in the page is enough for the network; the same return keeps
      // an accidental click from leaving this tab blank.
      document.addEventListener('click', function (ev) {
        remember();
        setTimeout(goBack, 2800);
      }, false);
    })();
  </script>
</body>
</html>
