<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sponsored — Hinataw.exe</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0c16; color: #e8e8f2; }
    body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #11121f;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.2px; }
    .brand span:first-child { color: #fff; }
    .brand span:last-child { color: #ff6ea8; }
    .back {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
      background: #ffbade; color: #0b0c16; text-decoration: none; font-weight: 800; font-size: 13.5px;
    }
    .back:hover { background: #ffd0e8; }
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px 56px; }
    .note { color: #a9a9bd; font-size: 13.5px; margin: 0 0 18px; }
    /* The tag injects its own creatives; this box keeps a stable slot for it. */
    #ad-slot {
      min-height: 260px; display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(255,255,255,0.12); border-radius: 14px; padding: 12px;
      background: rgba(255,255,255,0.02); overflow: hidden;
    }
    #ad-slot iframe, #ad-slot img, #ad-slot video { max-width: 100%; }
    .fine { color: #6f7086; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand"><span>Hinataw</span><span>.exe</span></div>
    <a class="back" href="/" target="_blank" rel="noopener">Open Hinataw.exe</a>
  </div>

  <main>
    <p class="note">
      This tab is sponsored — it is what keeps Hinataw.exe free. Your episode keeps
      playing in the tab you came from, and this tab never touches it.
    </p>
    <div id="ad-slot"></div>
    <p class="fine">Ads are served by our ad partner. You can close this tab at any time.</p>
  </main>

  <script>
    // This tab was opened by the player: sever the opener link immediately so no
    // ad code can navigate, reload or replace the page the viewer is watching.
    try { window.opener = null; } catch (e) {}
  </script>
  <!-- Owner tag (zone 12065764), loaded here in a real top-level tab so it can
       actually serve. The parked copy in public/index.html stays inert. -->
  <script>
    (function (s) {
      s.dataset.zone = '12065764';
      s.src = 'https://al5sm.com/tag.min.js';
    })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
  </script>
</body>
</html>
